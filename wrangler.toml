name = "weixian23-handbook"
compatibility_date = "2025-05-22"

# 纯静态资源 Worker：Next.js 静态导出 (output: 'export') 产物在 out/ 目录
# Cloudflare 边缘直接返回这些文件，不计入 Workers 请求额度
# 参考: https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./out"
# SPA 行为：不存在的路径走 not_found_handling，让 Next.js 的 404 页生效
not_found_handling = "404-page"
